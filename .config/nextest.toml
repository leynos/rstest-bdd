[profile.default]
# Kill any test once it crosses 60s.
slow-timeout = { period = "60s", terminate-after = 1, grace-period = "5s" }

# Accommodate cargo-spawning tests that deliberately run one at a time. The
# `cargo-spawning` group runs at `max-threads = 1`, so the worst case for the
# whole run is the sum of the group members' slow-timeouts: 180 s (cargo-bdd
# cli) + 300 s x 3 (trybuild/macro_compile binaries) + 600 s x 3
# (rstest-bdd::feature_rebuild_invalidation's dep-info, rebuild and
# file-addition scenarios) = 2880 s. 50 m gives comfortable headroom over
# that bound while still letting a genuinely hung run fail loudly at the run
# level (see the 10.3.3 ExecPlan's timeout-arithmetic decisions).
global-timeout = "50m"

[test-groups.cargo-spawning]
# Tests that shell out to `cargo` contend for the package-cache lock and for
# build parallelism. Run them one at a time so they neither starve the rest of
# the run nor trip their own slow-timeout waiting on a sibling's lock.
max-threads = 1

[[profile.default.overrides]]
# `cargo-bdd` CLI smoke tests spawn `cargo` to build fixture crates, which can
# legitimately exceed the default 60s slow-timeout on cold caches.
filter = "binary_id(cargo-bdd::cli)"
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }
test-group = "cargo-spawning"

[[profile.default.overrides]]
# trybuild-based compile tests invoke `cargo build` against a large dependency
# tree; on cold caches this can legitimately exceed the default 60 s limit.
# Allow the full fixture set to rebuild without treating slow, healthy compiler
# work as a hung test.
#
# The budget is sized for a genuinely cold compiler cache, which is what a
# trunk run meets after a cache eviction or a key change. Measured on
# `ubicloud-standard-2` for `rstest-bdd::trybuild_macros step_macros_compile`:
# it exceeded the former 10 minute budget on run 33871787845's first attempt
# with nothing in sccache, took 386.8 s on the rerun with 297 objects in
# scope, and 200.5 s and 186.1 s on runs 33884577115 and 33888769029 against
# a full generation. A passing test never spends the budget, so the larger
# figure costs nothing except on the run it rescues.
filter = "binary_id(rstest-bdd-harness-tokio::macro_compile) | binary_id(rstest-bdd-harness-gpui::macro_compile) | binary_id(rstest-bdd::trybuild_macros) | binary_id(rstest-bdd-server::workspace_discovery_compile)"
slow-timeout = { period = "20m", terminate-after = 1, grace-period = "5s" }
test-group = "cargo-spawning"

[[profile.default.overrides]]
# The 10.3.3 rebuild-invalidation tests run a hermetic nested `cargo` build of
# a scratch fixture (the dep-info scenario; one invocation) and then the full
# edit-and-rebuild experiment (two more invocations). Each nested invocation
# carries its own wall-clock bound in the harness (300 s, with a named
# failure), so this override only guards the whole test against the combined
# worst case.
filter = "binary_id(rstest-bdd::feature_rebuild_invalidation)"
slow-timeout = { period = "600s", terminate-after = 1, grace-period = "5s" }
test-group = "cargo-spawning"

[profile.long]
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }
global-timeout = "30m"

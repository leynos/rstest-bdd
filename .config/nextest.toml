[profile.default]
# Kill any test once it crosses 60s.
slow-timeout = { period = "60s", terminate-after = 1, grace-period = "5s" }

# Keep a run-level reserve for cold nested builds without relaxing per-test
# hang detection or allowing competing Cargo builds. R-6's sizing scenario
# was 180 + 600*4 + 600*3 = 4380 s; adding 19 s across ten cold invocations
# gives 4570 s, already beyond the old 75 m ceiling (4500 s). 145 m leaves
# 4130 s for that scenario, exceeding the required ten-minute reserve.
# This is an operational ceiling, NOT a sum of all per-test maxima: the
# compile tests now allow 120 m, and the feature-rebuild test allows 30 m.
# Nextest applies overrides per test, not per binary (the CLI has nine Cargo
# smoke tests). Tests still
# terminate at their own limits; increasing this ceiling adds no passing-run
# latency. The 165 m CI watchdog also covers 15 m of outer compilation and
# 65 s of termination/reporting; the 240 m job retains its 75 m allowance.
# Keep crates/rstest-bdd/tests/nextest_config.rs and the four-tier workflow
# contracts in step with future policy changes.
global-timeout = "145m"

[test-groups.cargo-spawning]
# Tests that shell out to `cargo` contend for the package-cache lock and for
# build parallelism. Run them one at a time so they neither starve the rest of
# the run nor trip their own slow-timeout waiting on a sibling's lock.
max-threads = 1

[[profile.default.overrides]]
# `cargo-bdd` CLI smoke tests spawn `cargo` to compile fixture targets. Their
# cold builds can wait on the shared package cache and compiler slots, so keep
# them serialized and allow the fixture compilation to finish.
filter = "binary_id(cargo-bdd::cli)"
slow-timeout = { period = "20m", terminate-after = 1, grace-period = "5s" }
test-group = "cargo-spawning"

[[profile.default.overrides]]
# These support tests invoke nested Cargo metadata/build commands, including
# from build-failure cases. Keep them serialized and allow cold commands to
# finish on a busy shared cache.
filter = "binary_id(rstest-bdd-harness::binary_test_support_cargo)"
slow-timeout = { period = "20m", terminate-after = 1, grace-period = "5s" }
test-group = "cargo-spawning"

[[profile.default.overrides]]
# trybuild-based compile tests invoke `cargo build` against a large dependency
# tree; on cold caches this can legitimately exceed the default 60 s limit.
# Allow the full fixture set to rebuild without treating slow, healthy compiler
# work as a hung test.
#
# The budget covers the full fixture sequence on a cold cache while Cargo
# waits for the shared package-cache lock and compiler slots. A local run on
# 2026-11-13 reached the former 60 m limit while compiling the should-pass
# `scenario_local_and_cross_crate_libraries.rs` fixture, then a 90 m run-level
# limit stopped the suite while `harness_context_coexist.rs` was still building.
# Keep enough room for the complete build and fixture sequence without treating
# slow, healthy compiler work as a hung test. A passing test never spends the
# budget, so the larger figure costs nothing except on the run it rescues.
filter = "binary_id(rstest-bdd-harness-tokio::macro_compile) | binary_id(rstest-bdd-harness-gpui::macro_compile) | binary_id(rstest-bdd::trybuild_macros) | binary_id(rstest-bdd-server::workspace_discovery_compile)"
slow-timeout = { period = "120m", terminate-after = 1, grace-period = "5s" }
test-group = "cargo-spawning"

[[profile.default.overrides]]
# The 10.3.3 rebuild-invalidation tests run a hermetic nested `cargo` build of
# a scratch fixture (the dep-info scenario; one invocation) and then the full
# edit-and-rebuild experiment (two more invocations). Each nested invocation
# has a 900 s child bound for cold compilation. A 2026-11-13 run reached the
# former 20 m outer limit while nested Cargo waited on the shared package-cache
# lock, so allow 30 m for the full test sequence while preserving the helper's
# named failure.
filter = "binary_id(rstest-bdd::feature_rebuild_invalidation)"
slow-timeout = { period = "30m", terminate-after = 1, grace-period = "5s" }
test-group = "cargo-spawning"

[profile.long]
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }
global-timeout = "30m"

# `priority` and the `slow-timeout` table form need nextest 0.9.91 or later.
nextest-version = "0.9.91"

[profile.default]
# Kill any test once it crosses 60s.
slow-timeout = { period = "60s", terminate-after = 1, grace-period = "5s" }

# Keep a run-level reserve for cold nested builds without relaxing per-test
# hang detection or allowing competing Cargo builds. R-6's sizing scenario
# was 180 + 600*4 + 600*3 = 4380 s; adding 19 s across ten cold invocations
# gives 4570 s, already beyond the old 75 m ceiling (4500 s). 90 m leaves
# 830 s for that scenario, exceeding the required ten-minute reserve.
# This is an operational ceiling, NOT a sum of all per-test maxima: the
# compile tests now allow 20 m each, and nextest applies overrides per test,
# not per binary (the CLI has nine Cargo smoke tests). Tests still
# terminate at their own limits; increasing this ceiling adds no passing-run
# latency. The 110 m CI watchdog also covers 15 m of outer compilation and
# 65 s of termination/reporting; the 190 m job retains its 75 m allowance.
# Keep crates/rstest-bdd/tests/nextest_config.rs and the four-tier workflow
# contracts in step with future policy changes.
global-timeout = "90m"

[test-groups.cargo-spawning]
# Tests that shell out to `cargo` contend for the package-cache lock and for
# build parallelism. Run them one at a time so they neither starve the rest of
# the run nor trip their own slow-timeout waiting on a sibling's lock.
max-threads = 1

[[profile.default.overrides]]
# The named preparation tests compile the dependency graphs that the nested
# Cargo suites would otherwise compile inside their own timed bodies: the
# `cargo-bdd` fixture, the shared trybuild tree, the UI-lint tree, and the
# rebuild-invalidation and feature-addition scratch fixtures.
#
# Order matters more than usual here. Each preparation test lives in the same
# test binary as the timed assertions it prepares, so the per-binary overrides
# below match it too, with 180 s, 20 m or 600 s. nextest applies the first
# override in file order that configures a setting, so this entry must stay
# first: anywhere else, the preparation would inherit a timed assertion's
# budget. `priority` is separate — it is scheduling, not precedence, and it
# gets these tests started early.
#
# This budget is not a deadline on any assertion, and it is not sized to be
# spent: `make prepare-nested-fixtures` runs these tests before the suite, so a
# normal lane spends only the stamp read. It bounds the genuinely cold case for
# a single preparation test; the sibling preparations queue behind it in the
# `cargo-spawning` group, and nextest starts a test's slow-timeout when the
# test begins running, not while it waits for the group. The `rstest-bdd`
# trybuild binary prepares the most, two graphs: its measured cold dependency
# build was 386.8 s and the UI-lint crate's graph is the same shape but smaller,
# so a fully cold preparation is comfortably inside 30 minutes. The four
# trybuild binaries share one generated-crate directory, so whichever prepares
# first warms the dependency graph and the rest stamp it in seconds. Exceeding
# the budget is reported as a preparation failure naming the fixture, not as an
# assertion timeout.
filter = "test(/nested_fixture_preparation$/)"
slow-timeout = { period = "30m", terminate-after = 1, grace-period = "5s" }
test-group = "cargo-spawning"
priority = 100

[[profile.default.overrides]]
# `cargo-bdd` CLI smoke tests spawn `cargo` to build fixture crates, which can
# legitimately exceed the default 60s slow-timeout on cold caches.
filter = "binary_id(cargo-bdd::cli)"
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }
test-group = "cargo-spawning"

[[profile.default.overrides]]
# trybuild-based compile tests invoke `cargo build` against a large dependency
# tree; on cold caches this can legitimately exceed the default 60 s limit.
# Allow the full fixture set to rebuild without treating slow, healthy compiler
# work as a hung test.
#
# The budget is sized for a genuinely cold compiler cache, which is what a
# trunk run meets after a cache eviction or a key change. Measured on
# `ubicloud-standard-2` for `rstest-bdd::trybuild_macros step_macros_compile`:
# it exceeded the former 10 minute budget on run 33871787845's first attempt
# with nothing in sccache, took 386.8 s on the rerun with 297 objects in
# scope, and 200.5 s and 186.1 s on runs 33884577115 and 33888769029 against
# a full generation. A passing test never spends the budget, so the larger
# figure costs nothing except on the run it rescues.
filter = "binary_id(rstest-bdd-harness-tokio::macro_compile) | binary_id(rstest-bdd-harness-gpui::macro_compile) | binary_id(rstest-bdd::trybuild_macros) | binary_id(rstest-bdd-server::workspace_discovery_compile)"
slow-timeout = { period = "20m", terminate-after = 1, grace-period = "5s" }
test-group = "cargo-spawning"

[[profile.default.overrides]]
# The 10.3.3 rebuild-invalidation tests run a hermetic nested `cargo` build of
# a scratch fixture (the dep-info scenario; one invocation) and then the full
# edit-and-rebuild experiment (two more invocations). Each nested invocation
# carries its own wall-clock bound in the harness (300 s, with a named
# failure), so this override only guards the whole test against the combined
# worst case.
filter = "binary_id(rstest-bdd::feature_rebuild_invalidation)"
slow-timeout = { period = "600s", terminate-after = 1, grace-period = "5s" }
test-group = "cargo-spawning"

[profile.long]
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }
global-timeout = "30m"

name: Namespace probe

# TEMPORARY: ExecPlan EP-M0 for issue 911. Proves whether an unprivileged
# network namespace is usable on each Linux runner type so decision D7 can be
# settled from evidence. `continue-on-error` means it reports and never gates.
# Delete this workflow once the result is recorded in the ExecPlan.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: namespace-probe-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  probe:
    name: probe (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubicloud-standard-2
            platform: ubicloud
          - os: ubuntu-latest
            platform: hosted
    steps:
      - name: Probe unprivileged network namespaces
        shell: bash
        run: |
          set -uxo pipefail
          {
            echo '--- runner ---'
            uname -a
            . /etc/os-release && echo "${PRETTY_NAME}"
            echo '--- user-namespace sysctls ---'
            sysctl kernel.unprivileged_userns_clone 2>&1 || true
            sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 || true
            sysctl user.max_user_namespaces 2>&1 || true
            echo '--- unshare, stock image ---'
            unshare --net --map-current-user sh -c \
              'echo INSIDE uid=$(id -u); ip addr show 2>&1 | head -20'
            echo "UNSHARE_STOCK_RC=$?"
            echo '--- unshare, apparmor restriction relaxed ---'
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>&1 || true
            unshare --net --map-current-user sh -c 'echo INSIDE uid=$(id -u)'
            echo "UNSHARE_RELAXED_RC=$?"
            echo '--- egress from inside a namespace ---'
            unshare --net --map-current-user \
              getent hosts static.crates.io 2>&1 || echo 'DNS_OR_EGRESS_BLOCKED'
          } 2>&1 | tee probe-userns.txt
      - name: Probe a filesystem socket across a namespace
        shell: bash
        run: |
          set -uxo pipefail
          python3 - <<'PY'
          import os
          import socket
          import subprocess
          import sys

          path = "/tmp/issue-911-probe.sock"
          if os.path.exists(path):
              os.unlink(path)
          server = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          server.bind(path)
          server.listen(1)
          client = (
              "import socket,sys;"
              "c=socket.socket(socket.AF_UNIX);"
              "c.connect(sys.argv[1]);"
              "c.sendall(b'ping');"
              "c.close()"
          )
          completed = subprocess.run(
              ["unshare", "--net", "--map-current-user",
               sys.executable, "-c", client, path],
              check=False,
          )
          print("UDS_ACROSS_NAMESPACE_RC", completed.returncode)
          server.settimeout(5)
          try:
              connection, _ = server.accept()
              print("SERVER_RECEIVED", connection.recv(4))
          except TimeoutError:
              print("SERVER_RECEIVED none")
          PY
      - name: Probe sccache inside a namespace
        shell: bash
        run: |
          set -uxo pipefail
          version=0.12.0
          url="https://github.com/mozilla/sccache/releases/download"
          curl -sSfL \
            "${url}/v${version}/sccache-v${version}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /tmp --strip-components=1 \
                "sccache-v${version}-x86_64-unknown-linux-musl/sccache"
          install -m 0755 /tmp/sccache /usr/local/bin/sccache
          sccache --version
          export SCCACHE_SERVER_UDS=/tmp/issue-911-sccache.sock
          export SCCACHE_DIR=/tmp/issue-911-sccache
          mkdir -p "$SCCACHE_DIR"
          sccache --start-server || true
          sccache --show-stats | head -5
          echo '--- show-stats inside the namespace ---'
          unshare --net --map-current-user sccache --show-stats | head -5
          echo '--- rustc through sccache inside the namespace ---'
          unshare --net --map-current-user sh -c \
            'rustc --version && RUSTC_WRAPPER=sccache rustc --crate-name probe \
               --emit=metadata -o /tmp/probe.rmeta /dev/null'
          echo "INSIDE_WRAPPED_RUSTC_RC=$?"
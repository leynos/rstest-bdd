name: Refresh derived fixture lockfiles

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - Cargo.toml
      - crates/**/Cargo.toml
      - tests/fixtures/published-gpui-0-2-2/Cargo.toml
      - tests/fixtures/published-gpui-e2e/Cargo.toml

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dependabot pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Setup Rust
        # Merged shared-actions PR #421 cache-provider revision. No job in
        # this repository archives a `target` tree, so the shared action's
        # Cargo and target cache stays disabled here too.
        uses: leynos/shared-actions/.github/actions/setup-rust@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
        with:
          cache-provider: external

      - name: Refresh standalone fixture lockfiles
        run: |
          make update-fixture-lockfiles

      - name: Configure Git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Commit refreshed lockfiles
        id: commit
        run: |
          if git diff --exit-code -- '**/Cargo.lock'; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -- '**/Cargo.lock'
          git commit -m 'chore(deps): refresh standalone fixture lockfiles'
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Push refreshed lockfiles
        if: ${{ steps.commit.outputs.changed == 'true' }}
        # The head ref reaches the shell as quoted data, never as script text.
        # Git ref names may contain shell metacharacters, and the Dependabot
        # guard narrows who can trigger this job, not what the ref may hold.
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: git push origin "HEAD:$HEAD_REF"

      - name: Validate refreshed fixture lockfiles
        if: ${{ steps.commit.outputs.changed != 'true' }}
        run: make check-fixture-lockfiles

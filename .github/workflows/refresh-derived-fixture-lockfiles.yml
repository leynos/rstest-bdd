name: Refresh derived fixture lockfiles

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - Cargo.toml
      - crates/**/Cargo.toml
      - tests/fixtures/published-gpui-0-2-2/Cargo.toml
      - tests/fixtures/published-gpui-e2e/Cargo.toml

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dependabot pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Setup Rust
        # Merged shared-actions PR #421 cache-provider revision. No job in
        # this repository archives a `target` tree, so the shared action's
        # Cargo and target cache stays disabled here too.
        uses: leynos/shared-actions/.github/actions/setup-rust@5daae0a332441d170d88ca648c9e71f0bbe96cb3
        with:
          cache-provider: external

      - name: Refresh derived fixture lockfiles
        run: |
          make update-derived-lockfiles

      - name: Configure Git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Commit refreshed lockfiles
        id: commit
        run: |
          # `make update-derived-lockfiles` owns the registered lockfile set;
          # derive the commit surface from the same registry instead of
          # restating the list here, so the workflow cannot drift from the
          # Makefile.
          lockfiles="$(make --no-print-directory derived-lockfile-paths)"
          if git diff --quiet -- \
            $lockfiles; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -- \
            $lockfiles
          git commit -m 'chore(deps): refresh derived fixture lockfiles'
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Push refreshed lockfiles
        if: ${{ steps.commit.outputs.changed == 'true' }}
        run: git push origin HEAD:${{ github.event.pull_request.head.ref }}

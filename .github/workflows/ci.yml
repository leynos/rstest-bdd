name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
      CODESCENE_CLI_SHA256: ${{ vars.CODESCENE_CLI_SHA256 }}
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
      LADING_REF: e0a8d43fa3d6d7598cad0d4c25883e7ea625feb9
      MERMAN_CLI_VERSION: '0.7.0'
      RUFF_VERSION: '0.16.4'
      TY_VERSION: '0.0.74'
      WHITAKER_INSTALLER_VERSION: '0.2.7'
      CARGO_BUILD_JOBS: '4'
      NEXTEST_TEST_THREADS: '4'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: namespace-profile-rust-linux-ci
            coverage: true
            features: ''
            with-default-features: true
            tools: true
            use-nextest: true
          - os: namespace-profile-rust-linux-ci
            coverage: true
            features: strict-compile-time-validation
            with-default-features: false
            tools: true
            use-nextest: true
          - os: namespace-profile-rust-windows-ci
            coverage: true
            features: ''
            with-default-features: true
            tools: false
            # Avoid Windows nested Cargo/nextest hangs; see
            # rust-lang/cargo#15744 and nextest-rs/nextest#2463.
            use-nextest: false
          - os: namespace-profile-rust-windows-ci
            coverage: true
            features: strict-compile-time-validation
            with-default-features: false
            tools: false
            # Avoid Windows nested Cargo/nextest hangs; see
            # rust-lang/cargo#15744 and nextest-rs/nextest#2463.
            use-nextest: false
    steps:
      - name: Verify and install Windows runner tools
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Get-Command git | Out-Null
          Get-Command bash | Out-Null
          Get-Command choco | Out-Null
          choco install make --yes --no-progress
          Get-Command make | Out-Null

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          # CodeScene's `cs-coverage check` diffs the pull request against
          # its merge base, so the full history must be reachable.
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          set -uo pipefail
          # Coverage builds the workspace once; `make publish-check` then
          # compiles it again into a separate target directory. On the
          # strict-feature leg the two builds exhaust the runner's disk, so
          # reclaim space from large preinstalled toolchains we do not use.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell || true
          df -h /

      - name: Setup Rust
        # TODO: Replace this temporary PR head after shared-actions PR #421 merges.
        uses: leynos/shared-actions/.github/actions/setup-rust@93ad65e414a16e8f8933a1ca114ccd480fdfa87e
        with:
          cache-provider: external
          use-sccache: 'false'

      - name: Install bun
        if: ${{ matrix.tools }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: '1.2.21'

      - name: Mount Namespace cache volume
        id: namespace-cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547
        with:
          cache: |
            bun
            rust
            uv
          path: |
            ~/.cache/sccache
            ${{ github.workspace }}/.ci-tools

      - name: Report Namespace cache status
        if: ${{ always() }}
        shell: bash
        env:
          NAMESPACE_CACHE_HIT: ${{ steps.namespace-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          printf 'namespace-cache.hit=%s\n' "$NAMESPACE_CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"

      # `.rustfmt.toml` uses unstable options, so `make check-fmt` shells out
      # to the pinned nightly rustfmt named by the Makefile's FMT_TOOLCHAIN.
      - name: Install nightly rustfmt
        if: ${{ matrix.tools }}
        run: rustup toolchain install nightly-2026-08-07 --profile minimal --component rustfmt

      - name: Check formatting
        if: ${{ matrix.tools }}
        run: make check-fmt

      - name: Install prebuilt Merman CLI
        if: ${{ matrix.tools }}
        shell: bash
        run: |
          tool_dir="$GITHUB_WORKSPACE/.ci-tools"
          mkdir -p "$tool_dir"
          cargo binstall --no-confirm --only-signed --disable-strategies compile \
            --install-path "$tool_dir" "merman-cli@${MERMAN_CLI_VERSION}"

      - name: Install prebuilt sccache
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$GITHUB_WORKSPACE/.ci-tools"
          mkdir -p "$tool_dir"
          cargo binstall --no-confirm --only-signed --disable-strategies compile \
            --install-path "$tool_dir" 'sccache@0.12.0'
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
          printf 'RUSTC_WRAPPER=%s/sccache\n' "$tool_dir" >> "$GITHUB_ENV"

      - name: Install Mermaid CLI
        if: ${{ matrix.tools }}
        run: |
          set -euxo pipefail
          bun install --no-progress --global @mermaid-js/mermaid-cli@11.9.0
          bun x @puppeteer/browsers browsers install chrome-headless-shell
          mmdc --version

      - name: Install Nixie
        if: ${{ matrix.tools }}
        run: uv tool install nixie-cli==1.1.0

      - name: Install Whitaker
        if: ${{ matrix.tools }}
        uses: leynos/shared-actions/.github/actions/install-whitaker@794e4801babcf68065c660fdf4781ad62be5d061
        with:
          installer-version: ${{ env.WHITAKER_INSTALLER_VERSION }}

      - name: Nixie
        if: ${{ matrix.tools }}
        run: make nixie

      - name: Markdown lint
        if: ${{ matrix.tools }}
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Spelling (en-GB-oxendict)
        if: ${{ matrix.tools }}
        run: make spelling

      - name: Lint
        if: ${{ matrix.tools }}
        run: make lint

      - name: Workflow contract tests
        if: ${{ matrix.tools && matrix.features == '' }}
        run: make test-workflow-contracts

      - name: Ensure async-trait is absent
        if: ${{ matrix.tools }}
        run: make forbid-async-trait

      - name: Type check
        if: ${{ matrix.tools }}
        run: make typecheck

      - name: Check published GPUI documentation fixture
        if: ${{ matrix.tools && matrix.with-default-features }}
        run: make check-published-gpui

      - name: Run published GPUI end-to-end scenario
        if: ${{ matrix.tools && matrix.with-default-features }}
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            pkg-config
          rustup toolchain install nightly-2026-08-07 --profile minimal
          make e2e-published-gpui

      - name: Test and Measure Coverage (with features)
        if: ${{ matrix.coverage && matrix.features != '' }}
        # TODO: Replace this temporary PR head after shared-actions PR #421 merges.
        uses: leynos/shared-actions/.github/actions/generate-coverage@93ad65e414a16e8f8933a1ca114ccd480fdfa87e
        continue-on-error: true
        env:
          # Windows coverage runs (build plus doctests) exceed the shared
          # action's 600s per-invocation default; give them headroom.
          RUN_RUST_CARGO_WAIT_TIMEOUT: '1800'
        with:
          cache-provider: external
          output-path: coverage.xml
          format: cobertura
          features: rstest-bdd/diagnostics rstest-bdd-server/test-support ${{ matrix.features }}
          with-default-features: ${{ matrix.with-default-features }}
          use-cargo-nextest: ${{ matrix.use-nextest }}
          # Run the Python coverage suite serially: the whitaker lint-gate
          # integration test shells out to `cargo dylint`, so parallel
          # xdist workers race on the cargo package-cache lock.
          pytest-workers: ''

      - name: Test and Measure Coverage (no features)
        if: ${{ matrix.coverage && matrix.features == '' }}
        # TODO: Replace this temporary PR head after shared-actions PR #421 merges.
        uses: leynos/shared-actions/.github/actions/generate-coverage@93ad65e414a16e8f8933a1ca114ccd480fdfa87e
        # The CodeScene leg (the default-features Linux leg) gates on the
        # ratchet, so a coverage failure must fail the build there; other
        # legs stay best-effort as before. Selected by matrix values rather
        # than a dedicated key so the job name (a required check context)
        # is unchanged.
        continue-on-error: ${{ !(matrix.os == 'namespace-profile-rust-linux-ci' && matrix.features == '') }}
        env:
          # Windows coverage runs (build plus doctests) exceed the shared
          # action's 600s per-invocation default; give them headroom.
          RUN_RUST_CARGO_WAIT_TIMEOUT: '1800'
        with:
          cache-provider: external
          output-path: coverage.xml
          format: cobertura
          features: rstest-bdd/diagnostics rstest-bdd-macros/compile-time-validation rstest-bdd-server/test-support
          with-default-features: ${{ matrix.with-default-features }}
          use-cargo-nextest: ${{ matrix.use-nextest }}
          # Run the Python coverage suite serially: the whitaker lint-gate
          # integration test shells out to `cargo dylint`, so parallel
          # xdist workers race on the cargo package-cache lock.
          pytest-workers: ''
          # Ratchet only the default-features Linux leg: the two Linux
          # coverage legs would otherwise collide on the per-run baseline
          # cache key.
          with-ratchet: ${{ (matrix.os == 'namespace-profile-rust-linux-ci' && matrix.features == '') && 'true' || 'false' }}

      - name: Verify coverage output exists
        if: ${{ matrix.coverage }}
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage.xml

      - name: Check coverage against CodeScene gates
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: >-
          matrix.os == 'namespace-profile-rust-linux-ci' &&
          matrix.features == '' &&
          github.event_name == 'pull_request' &&
          env.CS_ACCESS_TOKEN != ''
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@794e4801babcf68065c660fdf4781ad62be5d061
        with:
          format: cobertura
          mode: check
          project-url: https://api.codescene.io/v2/projects/69391
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}

      - name: Publish dry run
        run: make publish-check

      - name: Report sccache statistics
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          else
            echo 'sccache was unavailable before its prebuilt installation completed.'
          fi

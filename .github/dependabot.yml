version: 2
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    directory: "/"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  # Enable version updates for Cargo. The workspace root covers all member
  # crates; the additional directories are standalone test-fixture packages
  # that are not workspace members.
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/crates/cargo-bdd/tests/fixtures/minimal"
      - "/crates/rstest-bdd/tests/fixtures_macros"
      - "/crates/rstest-bdd/tests/ui_macros"
      - "/crates/rstest-bdd/tests/ui_lints"
      - "/tests/fixtures/published-gpui-0-2-2"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cargo"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14

  # Enable version updates for the uv-managed Python tooling environment
  - package-ecosystem: "uv"
    directory: "/"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "uv"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: rust-toolchain
    directory: /
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust-toolchain
    schedule:
      interval: daily

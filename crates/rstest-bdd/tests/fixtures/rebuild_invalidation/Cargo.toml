[package]
name = "rstest-bdd-rebuild-invalidation-fixture"
version = "0.1.0"
edition = "2024"

# The fixture resolves through its own lockfile in the shared `target/`, so
# its graph is what decides which of the workspace's compiled units it can
# reuse. `features = ["diagnostics", "test-support"]` matches the workspace's
# `--all-features` build, and the committed lockfile is seeded from the
# workspace lock so shared crates resolve to the same versions.
#
# Only what the fixture's sources use is named here. `rstest-bdd-macros`
# provides the `#[scenario]`-bound test, and `rstest` is required because that
# expansion unconditionally emits `#[rstest::rstest]`. `inventory` and
# `serial_test` used to be named as well, at `"0.3"` and `"2"`; nothing in this
# fixture imports either, and the `"2"` requirement dragged `serial_test` 2.0.0
# and a second `dashmap`/`hashbrown` pair into the build alongside the
# workspace's 4.0.1. `scripts/fixture_lockfile_alignment.py` fails if a package
# here resolves to a version or source the workspace did not pick.
[dependencies]
rstest-bdd = { path = "../../../../../crates/rstest-bdd", features = ["diagnostics", "test-support"] }

[dev-dependencies]
rstest = "0.26.1"
rstest-bdd-macros = { path = "../../../../../crates/rstest-bdd-macros" }

[workspace]